name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The safety contract, checked on every change: a production build
      # contains neither the route that writes files nor the editor.
      - name: reword is absent from the production build
        run: |
          ! grep -rl "data-reword" .next/static
          ! grep -rl "createSourceFile" .next/server
          ! ls .next/server/app/api 2>/dev/null | grep -q reword
